<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.data.site.name }}</title>
<meta name="description" content="{{ page.summary | default: page.excerpt | default: site.data.site.tagline }}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Source+Serif+4:wght@400;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}"></head><body>
<header class="nav"><a class="logo" href="{{ '/' | relative_url }}">{{ site.data.site.name }}</a>
<nav><a href="{{ '/#projects' | relative_url }}">Projects</a><a href="{{ '/#writing' | relative_url }}">Writing</a><a href="{{ '/#gallery' | relative_url }}">Gallery</a><a href="{{ '/#contact' | relative_url }}">Contact</a></nav></header>
<main>{{ content }}</main>
<footer class="foot">{{ site.data.site.name }}, {{ 'now' | date: '%Y' }}</footer>
<script src="{{ '/assets/main.js' | relative_url }}" defer></script></body></html>
